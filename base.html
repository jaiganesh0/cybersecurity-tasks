<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Secure Login{% endblock %}</title>
<style>
 body{font-family:system-ui,Arial,sans-serif;background:#f1f5f9;margin:0;display:flex;justify-content:center;padding:40px 16px}
 .card{background:#fff;max-width:380px;width:100%;padding:28px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
 h2{margin-top:0} label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
 input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;font-size:15px}
 button{margin-top:16px;width:100%;padding:11px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-size:15px;cursor:pointer}
 .error{background:#fee2e2;color:#991b1b;padding:8px 10px;border-radius:6px;margin:8px 0;font-size:14px}
 .ok{background:#dcfce7;color:#166534;padding:8px 10px;border-radius:6px;margin:8px 0;font-size:14px}
 a{color:#2563eb} code{word-break:break-all;background:#f1f5f9;padding:2px 4px;border-radius:4px}
</style></head><body><div class="card">
{% with msgs = get_flashed_messages(with_categories=true) %}
 {% for cat, m in msgs %}<div class="{{ cat }}">{{ m }}</div>{% endfor %}
{% endwith %}
{% block body %}{% endblock %}
</div></body></html>
