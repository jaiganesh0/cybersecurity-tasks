{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block body %}<h2>Create account</h2>
<form method="post" autocomplete="off">
 <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
 <label>Username</label><input name="username" maxlength="20" required>
 <label>Email</label><input name="email" type="email" maxlength="120" required>
 <label>Password</label><input name="password" type="password" minlength="10" required>
 <label>Confirm password</label><input name="confirm" type="password" required>
 <button>Register</button>
</form><p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>{% endblock %}
